version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: netbird-peer-community-edition_web_1
      APP_PORT: 80

  # NetBird daemon as root with a real wt0 interface (no netstack mode).
  # Config path matches the official rootless app, so its config.json can be reused.
  app:
    image: ghcr.io/netbirdio/netbird:0.81.3@sha256:f8a4ea01da9f2351d5c9436209ee9caf35dd118fc9c1fc2ce7859f0c6e44781c
    restart: on-failure
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      NB_CONFIG: /var/lib/netbird/config.json
      NB_STATE_DIR: /var/lib/netbird
      NB_DAEMON_ADDR: unix:///var/lib/netbird/netbird.sock
      NB_DISABLE_DNS: "true"
      NB_LOG_FILE: console
    # Optional setup.env (NB_MANAGEMENT_URL, NB_SETUP_KEY) for the first registration
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /var/lib/netbird/setup.env ]; then
          set -a
          . /var/lib/netbird/setup.env
          set +a
        fi
        exec /usr/local/bin/netbird-entrypoint.sh
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/var/lib/netbird

  # Writes `netbird status --json` for the web interface every 10 seconds
  status:
    image: ghcr.io/netbirdio/netbird:0.81.3@sha256:f8a4ea01da9f2351d5c9436209ee9caf35dd118fc9c1fc2ce7859f0c6e44781c
    restart: on-failure
    depends_on:
      - app
    environment:
      NB_DAEMON_ADDR: unix:///var/lib/netbird/netbird.sock
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if netbird status --json > /status/status.tmp 2> /status/error.txt; then
            mv /status/status.tmp /status/status.json
          else
            cat /status/status.tmp >> /status/error.txt
            echo '{"daemonStatus":"Unavailable"}' > /status/status.json
          fi
          sleep 10
        done
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/var/lib/netbird:ro
      - ${APP_DATA_DIR}/data/www/status:/status

  # status/ lives inside www, a nested mount into the read-only www mount fails
  web:
    image: nginx:1.27@sha256:124b44bfc9ccd1f3cedf4b592d4d1e8bddb78b51ec2ed5056c52d3692baebc19
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
